name: Publish .NET 8.0 and 10.0 Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ["8.0", "10.0"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish ACMEServer.ADCS
        run: |
          dotnet publish src/ACMEServer.ADCS/ACMEServer.ADCS.csproj --configuration Release --framework net${{ matrix.dotnet-version }}-windows --output "artifacts/${{ matrix.dotnet-version }}/ACMEServer.ADCS"

      - name: Upload published artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-net${{ matrix.dotnet-version }}
          path: artifacts/${{ matrix.dotnet-version }}/
