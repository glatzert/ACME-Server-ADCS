version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: daily
    ignore:
      - dependency-name: "System.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - version-update:semver-major